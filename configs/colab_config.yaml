model:
  name: "openmind-125m"
  vocab_size: 32000
  max_seq_len: 512          # Shorter for Colab memory constraints
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 12
  intermediate_dim: 2048
  dropout: 0.0
  tie_embeddings: true
  rope_theta: 10000.0

training:
  batch_size: 64
  micro_batch: 8             # Fits in T4 16GB
  max_steps: 10000           # ~2-3 hours on T4
  warmup_steps: 500
  lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  scheduler: "cosine"
  dtype: "float16"           # T4 doesn't support bf16
  compile: false             # Colab may not support torch.compile well
  gradient_accumulation_steps: 8
  seed: 42

data:
  train_path: "data/train.bin"
  val_path: "data/val.bin"
  val_tokens: 1000000
  shuffle: true

checkpoint:
  save_every: 2000
  keep_last_n: 2
  output_dir: "models/checkpoints"

logging:
  use_wandb: false
  log_every: 50
  project_name: "openmind-colab"
