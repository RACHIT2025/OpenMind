model:
  name: "openmind-125m"
  vocab_size: 32000
  max_seq_len: 2048
  dim: 768
  n_layers: 12
  n_heads: 12
  n_kv_heads: 12
  dropout: 0.0
  tie_embeddings: true
  rope_theta: 10000.0
  intermediate_dim: 2048

training:
  batch_size: 512
  micro_batch: 16
  max_steps: 100000
  warmup_steps: 2000
  lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  scheduler: "cosine"
  dtype: "bfloat16"
  compile: true
  gradient_accumulation_steps: auto
  seed: 42

data:
  train_path: "data/train.bin"
  val_path: "data/val.bin"
  val_tokens: 100000000
  shuffle: true

checkpoint:
  save_every: 5000
  keep_last_n: 3
  output_dir: "models/checkpoints"

logging:
  use_wandb: false
  log_every: 10
  project_name: "openmind-train"
